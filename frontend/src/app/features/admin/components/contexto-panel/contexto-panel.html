<div class="space-y-6">
  @if (cargando()) {
    <p role="status" class="rounded-xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400">
      Cargando contexto…
    </p>
  } @else {
    @if (vacio()) {
      <div
        role="status"
        aria-live="polite"
        class="rounded-xl border border-amber-200 bg-amber-50 p-4 dark:border-amber-500/30 dark:bg-amber-500/10"
      >
        <p class="text-sm text-amber-800 dark:text-amber-200">
          <span class="font-semibold">Contexto de empresa no definido.</span> La IA está operando sin contexto
          (caso 24). Completa el formulario o sube un archivo para que use tu empresa como referencia.
        </p>
      </div>
    }

    <div class="flex justify-end">
      <button
        type="button"
        (click)="onDescargarPlantilla()"
        [disabled]="descargando()"
        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-300 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:focus:ring-slate-500/40"
      >
        {{ descargando() ? 'Descargando…' : 'Descargar plantilla' }}
      </button>
    </div>

    <app-contexto-form />

    <app-contexto-subida />
  }
</div>
