<div class="rounded-xl border border-slate-200 bg-white p-6">
  <h2 class="text-base font-semibold text-slate-900">Nuevo usuario</h2>
  <p class="mt-1 text-sm text-slate-500">
    Se generará una contraseña temporal que solo verás una vez.
  </p>

  <form (ngSubmit)="onSubmit()" class="mt-4 grid gap-4 sm:grid-cols-2">
    <div class="sm:col-span-2">
      <label for="new-username" class="mb-1 block text-sm font-medium text-slate-700">
        Nombre de usuario
      </label>
      <input
        id="new-username"
        type="text"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        name="username"
        required
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>
    <div>
      <label for="new-name" class="mb-1 block text-sm font-medium text-slate-700">Nombre</label>
      <input
        id="new-name"
        type="text"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="name"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>
    <div>
      <label for="new-area" class="mb-1 block text-sm font-medium text-slate-700">Área</label>
      <input
        id="new-area"
        type="text"
        [ngModel]="area()"
        (ngModelChange)="area.set($event)"
        name="area"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>
    <div class="sm:col-span-2">
      <label for="new-contact" class="mb-1 block text-sm font-medium text-slate-700">
        Contacto
      </label>
      <input
        id="new-contact"
        type="text"
        [ngModel]="contact()"
        (ngModelChange)="contact.set($event)"
        name="contact"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
      />
    </div>

    @if (error()) {
      <p role="alert" class="sm:col-span-2 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">
        {{ error() }}
      </p>
    }

    <div class="sm:col-span-2">
      <button
        type="submit"
        [disabled]="loading() || username().trim() === ''"
        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Creando…' : 'Crear usuario' }}
      </button>
    </div>
  </form>
</div>
