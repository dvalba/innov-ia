<app-idea-card
  variant="full"
  [titulo]="entrada().fields.title"
  [meta]="[metaLinea()]"
  [proponente]="entrada().fields.proponent"
  [campos]="entrada().fields"
>
  <div idea-card-actions class="mt-4">
    @if (error()) {
      <div
        role="alert"
        class="mb-4 flex items-start justify-between gap-4 rounded-lg bg-red-50 px-4 py-3"
      >
        <p class="text-sm text-red-700">{{ error() }}</p>
        <button
          type="button"
          (click)="descartarError()"
          class="shrink-0 text-sm text-red-600 underline hover:text-red-800"
        >
          Cerrar
        </button>
      </div>
    }

    @if (rechazando()) {
      <div class="rounded-lg border border-red-200 bg-red-50 p-4">
        <label
          for="comentario-rechazo"
          class="mb-1 block text-sm font-medium text-red-800"
        >
          Motivo del rechazo (obligatorio)
        </label>
        <textarea
          id="comentario-rechazo"
          [value]="comentario()"
          (input)="comentario.set($any($event.target).value)"
          rows="3"
          placeholder="Describe por qué no apruebas la publicación y qué debe corregirse."
          class="w-full rounded-lg border border-red-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-red-400 focus:ring-2 focus:ring-red-200"
        ></textarea>
        <p class="mt-1 text-xs text-red-600">
          La iniciativa volverá a «En desarrollo» y el proponente verá esta nota.
        </p>
        <div class="mt-3 flex flex-wrap gap-2">
          <button
            type="button"
            [disabled]="enviando() || ocupado() || comentario().trim() === ''"
            (click)="onRechazar()"
            class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-300 disabled:cursor-not-allowed disabled:opacity-60"
          >
            {{ enviando() ? 'Rechazando…' : 'Rechazar con este motivo' }}
          </button>
          <button
            type="button"
            [disabled]="enviando() || ocupado()"
            (click)="cancelarRechazo()"
            class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-300 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Cancelar
          </button>
        </div>
      </div>
    } @else {
      <div class="flex flex-wrap gap-2">
        <button
          type="button"
          [disabled]="enviando() || ocupado()"
          (click)="onValidar()"
          class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-300 disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ enviando() ? 'Validando…' : 'Validar' }}
        </button>
        <button
          type="button"
          [disabled]="enviando() || ocupado()"
          (click)="activarRechazo()"
          class="rounded-lg border border-red-300 bg-white px-4 py-2 text-sm font-medium text-red-700 transition hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-300 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Rechazar
        </button>
      </div>
    }
  </div>
</app-idea-card>
