<div class="flex justify-start">
  <div
    class="w-full max-w-[85%] rounded-2xl rounded-bl-sm border border-amber-200 bg-amber-50 px-4 py-3 text-sm shadow-sm"
    role="group"
    aria-label="Sugerencia de título"
  >
    <p class="mb-1 font-medium text-amber-800">Sugerencia de título</p>
    <p class="mb-3 whitespace-pre-wrap break-words text-slate-800">
      {{ sugerencia().text }}
    </p>

    <div class="flex flex-wrap items-center gap-2">
      @if (sugerencia().actions.includes('accept')) {
        <button
          type="button"
          (click)="emitir('accept')"
          [disabled]="cargando()"
          class="rounded-lg bg-amber-500 px-3 py-1.5 font-medium text-white transition hover:bg-amber-600 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Aceptar
        </button>
      }
      @if (sugerencia().actions.includes('another')) {
        <button
          type="button"
          (click)="emitir('another')"
          [disabled]="cargando()"
          class="rounded-lg border border-amber-300 px-3 py-1.5 font-medium text-amber-700 transition hover:bg-amber-100 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Pedir otra
        </button>
      }
      @if (sugerencia().actions.includes('manual')) {
        <div class="flex w-full flex-wrap items-center gap-2">
          <input
            type="text"
            name="textoManual"
            [ngModel]="textoManual()"
            (ngModelChange)="textoManual.set($event)"
            placeholder="O escribe el título que prefieras"
            class="min-w-0 flex-1 rounded-lg border border-amber-300 px-3 py-1.5 text-slate-900 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200"
          />
          <button
            type="button"
            (click)="onManual()"
            [disabled]="cargando() || textoManual().trim() === ''"
            class="rounded-lg border border-amber-300 px-3 py-1.5 font-medium text-amber-700 transition hover:bg-amber-100 disabled:cursor-not-allowed disabled:opacity-60"
          >
            Usar mi título
          </button>
        </div>
      }
    </div>
  </div>
</div>
