<div class="space-y-5">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <div class="min-w-0 flex-1">
      <button
        type="button"
        (click)="irAlDetalle()"
        class="mb-2 inline-flex items-center gap-1 text-sm font-medium text-slate-500 transition hover:text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-300 dark:text-slate-400 dark:hover:text-slate-200"
      >
        <span aria-hidden="true">←</span>
        Volver al detalle
      </button>
      <h1 class="truncate text-xl font-semibold text-slate-900 dark:text-slate-100">
        Debate · {{ titulo() }}
      </h1>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
        Hilo completo del debate. Solo lectura.
      </p>
    </div>
    <a
      [routerLink]="['/catalogo/publico', ideaId]"
      class="shrink-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
    >
      Ver detalle
    </a>
  </header>

  @if (debate.error()) {
    <p role="alert" class="rounded-xl border border-red-200 bg-red-50 p-6 text-sm text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300">
      {{ mensajeError() }}
    </p>
  } @else {
    <app-debate-panel [ideaId]="ideaId" [debate]="debateValor()" [soloLectura]="true" />
  }
</div>
