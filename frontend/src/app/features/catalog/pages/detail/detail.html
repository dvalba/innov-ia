<div class="space-y-5">
  <header>
    <button
      type="button"
      (click)="irAlCatalogo()"
      class="inline-flex w-fit items-center gap-1.5 text-sm font-medium text-slate-500 transition hover:text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-300 dark:text-slate-400 dark:hover:text-indigo-300"
    >
      <span aria-hidden="true">←</span> Volver al catálogo
    </button>
  </header>

  @if (detalle.error()) {
    <div class="rounded-xl border border-slate-200 bg-white p-8 text-center dark:border-slate-700 dark:bg-slate-900">
      <p class="text-sm font-medium text-slate-700 dark:text-slate-300">
        {{ mensajeError() }}
      </p>
      <a
        routerLink="/catalogo"
        class="mt-4 inline-block rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
      >
        Volver al catálogo
      </a>
    </div>
  } @else if (detalle.isLoading()) {
    <p
      role="status"
      class="rounded-xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400"
    >
      Cargando iniciativa…
    </p>
  } @else {
    @let idea = detalle.value();
    @if (idea) {
      <app-idea-card
        variant="full"
        [titulo]="idea.fields.title"
        [meta]="meta()"
        [proponente]="idea.fields.proponent"
        [campos]="idea.fields"
      />

      <section aria-labelledby="debate-titulo">
        <h2 id="debate-titulo" class="mb-2 text-base font-semibold text-slate-900 dark:text-slate-100">
          Debate público
        </h2>
        <app-debate-panel
          [ideaId]="ideaId"
          [debate]="debate.value() ?? null"
          [esAdmin]="esAdmin()"
          (actualizado)="refresh()"
        />
      </section>

      <section aria-labelledby="evaluacion-titulo">
        <h2 id="evaluacion-titulo" class="mb-2 text-base font-semibold text-slate-900 dark:text-slate-100">
          Evaluación
        </h2>
        <app-evaluation-panel
          [ideaId]="ideaId"
          [evaluation]="idea.evaluation"
          [aiEvaluation]="idea.aiEvaluation"
          [especialista]="especialista()"
          (actualizada)="refresh()"
        />
      </section>
    }
  }
</div>
