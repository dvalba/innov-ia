<div class="flex min-h-screen flex-col items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-2xl font-bold text-white">
        I
      </div>
      <h1 class="text-xl font-semibold text-slate-900">Innov-IA</h1>
      <p class="mt-1 text-sm text-slate-500">Inicia sesión para continuar</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="mb-1 block text-sm font-medium text-slate-700">
          Nombre de usuario
        </label>
        <input
          id="username"
          type="text"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          autocomplete="username"
          required
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-slate-700">
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          autocomplete="current-password"
          required
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      @if (error()) {
        <p role="alert" class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Iniciando…' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</div>
