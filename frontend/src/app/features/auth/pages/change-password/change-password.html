<div class="flex min-h-screen flex-col items-center justify-center bg-slate-50 p-4 dark:bg-slate-950">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-lg dark:border-slate-800 dark:bg-slate-900" role="dialog" aria-labelledby="change-password-title">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-amber-500 text-2xl font-bold text-white">
        !
      </div>
      <h1 id="change-password-title" class="text-xl font-semibold text-slate-900 dark:text-slate-100">
        Cambio de contraseña
      </h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Debes cambiar tu contraseña temporal antes de continuar.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="currentPassword" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">
          Contraseña actual
        </label>
        <input
          id="currentPassword"
          type="password"
          [ngModel]="currentPassword()"
          (ngModelChange)="currentPassword.set($event)"
          name="currentPassword"
          autocomplete="current-password"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        />
      </div>

      <div>
        <label for="newPassword" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">
          Nueva contraseña
        </label>
        <input
          id="newPassword"
          type="password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
          autocomplete="new-password"
          minlength="6"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        />
        <p class="mt-1 text-xs text-slate-400 dark:text-slate-500">Mínimo 6 caracteres.</p>
      </div>

      <div>
        <label for="confirmPassword" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">
          Confirmar nueva contraseña
        </label>
        <input
          id="confirmPassword"
          type="password"
          [ngModel]="confirm()"
          (ngModelChange)="confirm.set($event)"
          name="confirmPassword"
          autocomplete="new-password"
          required
          [class.border-red-400]="passwordMismatch"
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
        />
        @if (passwordMismatch) {
          <p class="mt-1 text-xs text-red-500 dark:text-red-400" role="alert">
            La confirmación no coincide.
          </p>
        }
      </div>

      @if (error()) {
        <p role="alert" class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600 dark:bg-red-500/15 dark:text-red-300">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading() || currentPassword() === '' || newPassword().length < 6 || passwordMismatch"
        class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Guardando…' : 'Cambiar contraseña' }}
      </button>
    </form>

    <div class="mt-6 flex items-center justify-center">
      <app-theme-picker />
    </div>
  </div>
</div>
