@if (abierto()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 dark:bg-black/60"
    (mousedown.self)="onCancel()"
  >
    <div
      #panel
      role="dialog"
      aria-modal="true"
      aria-labelledby="cd-title"
      aria-describedby="cd-message"
      (keydown)="onKeydown($event)"
      class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl dark:bg-slate-900"
    >
      <h2 id="cd-title" class="text-base font-semibold text-slate-900 dark:text-slate-100">{{ titulo() }}</h2>
      <p id="cd-message" class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">{{ mensaje() }}</p>
      <div class="mt-6 flex flex-wrap justify-end gap-3">
        <button
          type="button"
          [disabled]="ocupado()"
          (click)="onCancel()"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:focus:ring-slate-500"
        >
          {{ cancelarEtiqueta() }}
        </button>
        <button
          #confirmar
          type="button"
          [disabled]="ocupado()"
          (click)="onConfirm()"
          class="rounded-lg px-4 py-2 text-sm font-medium text-white transition focus:outline-none focus:ring-2 disabled:cursor-not-allowed disabled:opacity-60"
          [class]="peligro() ? 'bg-red-600 hover:bg-red-700 focus:ring-red-300' : 'bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-300'"
        >
          {{ confirmarEtiqueta() }}
        </button>
      </div>
    </div>
  </div>
}
