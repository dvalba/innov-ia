<div
  class="rounded-lg border border-slate-200 p-4 dark:border-slate-700"
  role="img"
  [attr.aria-label]="
    titulo() +
    (promedio() != null
      ? '. Promedio: ' + promedioPct()
      : '. Sin promedio.')
  "
>
  <div class="mb-3 flex items-center justify-between gap-3">
    <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
      {{ titulo() }}
    </p>
    <span class="text-sm font-semibold tabular-nums text-slate-800 dark:text-slate-100">
      {{ promedioPct() ?? '—' }}
    </span>
  </div>

  <div class="relative h-3 overflow-hidden rounded-full">
    <div class="flex h-full w-full" aria-hidden="true">
      @for (seccion of secciones(); track seccion.etiqueta) {
        <div [style.width.%]="seccion.ancho" [class]="seccion.clase"></div>
      }
    </div>

    @if (marcadorPos() != null) {
      <div
        class="absolute top-0 h-full w-1 rounded-sm"
        [style.left.%]="marcadorPos()"
        [class]="marcadorClase()"
        aria-hidden="true"
      ></div>
    }
  </div>

  <div class="relative mt-1 h-4 text-[10px] font-medium text-slate-400 dark:text-slate-500" aria-hidden="true">
    <span class="absolute left-0">0</span>
    <span
      class="absolute -translate-x-1/2"
      [style.left.%]="umbrales().rejectionThreshold * 10"
    >
      {{ umbrales().rejectionThreshold }}
    </span>
    <span
      class="absolute -translate-x-1/2"
      [style.left.%]="umbrales().acceptanceThreshold * 10"
    >
      {{ umbrales().acceptanceThreshold }}
    </span>
    <span class="absolute right-0">10</span>
  </div>

  <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1">
    @for (seccion of secciones(); track seccion.etiqueta) {
      <span class="inline-flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-300">
        <span class="h-2 w-2 rounded-full" [class]="seccion.dot" aria-hidden="true"></span>
        {{ seccion.etiqueta }}
      </span>
    }
  </div>
</div>
